<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>比赛房间</title>

    <link rel="stylesheet" href="/room.css">
</head>

<body hidden>

<header class="top-bar">

    <div class="brand">
        手机市场
    </div>

    <div class="user-area">

        <span id="nicknameText">
            玩家
        </span>

        <button
                id="homeButton"
                class="secondary-button"
                type="button"
        >
            返回主页
        </button>

        <button
                id="logoutButton"
                class="danger-button"
                type="button"
        >
            退出登录
        </button>

    </div>

</header>

<main class="page-container">

    <section class="room-header-card">

        <div>

            <p class="page-label">
                比赛房间
            </p>

            <h1>
                房间号：
                <span id="gameIdText">-</span>
            </h1>

            <p id="roomDescription">
                正在读取房间信息
            </p>

        </div>

        <div
                id="statusBadge"
                class="status-badge waiting"
        >
            等待开始
        </div>

    </section>

    <section class="content-grid">

        <section class="content-card">

            <div class="section-heading">

                <div>
                    <h2>房间玩家</h2>

                    <p id="playerCountText">
                        当前 0 名玩家
                    </p>
                </div>

                <button
                        id="refreshButton"
                        class="secondary-button"
                        type="button"
                >
                    刷新
                </button>

            </div>

            <div
                    id="playerList"
                    class="player-list"
            ></div>

            <div
                    id="emptyPlayerText"
                    class="empty-state"
            >
                暂无玩家信息
            </div>

        </section>

        <aside class="content-card room-info-card">

            <h2>房间信息</h2>

            <dl class="room-info-list">

                <div>
                    <dt>房间状态</dt>
                    <dd id="roomStatusText">-</dd>
                </div>

                <div>
                    <dt>房主</dt>
                    <dd id="ownerText">-</dd>
                </div>

                <div>
                    <dt>当前人数</dt>
                    <dd id="currentPlayersText">-</dd>
                </div>

                <div>
                    <dt>最大人数</dt>
                    <dd>4</dd>
                </div>

                <div>
                    <dt>当前回合</dt>
                    <dd id="currentRoundText">-</dd>
                </div>

                <div>
                    <dt>最大回合</dt>
                    <dd id="maxRoundText">-</dd>
                </div>

            </dl>

            <div class="room-actions">

                <button
                        id="startGameButton"
                        class="primary-button hidden"
                        type="button"
                >
                    开始比赛
                </button>

                <button
                        id="leaveRoomButton"
                        class="danger-button"
                        type="button"
                >
                    离开房间
                </button>

            </div>

            <p
                    id="actionHint"
                    class="hint-text"
            ></p>

        </aside>

    </section>

</main>

<div
        id="messageModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
>

    <div class="modal-box">

        <h2 id="messageTitle">
            提示
        </h2>

        <p id="messageText"></p>

        <button
                id="closeMessageButton"
                class="primary-button full-button"
                type="button"
        >
            确定
        </button>

    </div>

</div>

<script src="/room.js"></script>

</body>
</html>
