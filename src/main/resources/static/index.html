<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>手机市场</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 320px;
            margin: 100px auto;
            padding: 24px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            cursor: pointer;
        }

        .switch-button {
            border: none;
            background: none;
            color: blue;
        }

        .hidden {
            display: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 登录界面 -->
    <div id="loginPage">

        <h2>用户登录</h2>

        <form id="loginForm">

            <div class="form-group">
                <label for="loginUsername">用户名</label>

                <input
                        id="loginUsername"
                        type="text"
                        required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">密码</label>

                <input
                        id="loginPassword"
                        type="password"
                        required
                >
            </div>

            <button type="submit">
                登录
            </button>

        </form>

        <button
                id="goToRegisterButton"
                class="switch-button"
                type="button"
        >
            没有账号？前往注册
        </button>

    </div>

    <!-- 注册界面 -->
    <div id="registerPage" class="hidden">

        <h2>用户注册</h2>

        <form id="registerForm">

            <div class="form-group">
                <label for="registerNickname">昵称</label>

                <input
                        id="registerNickname"
                        type="text"
                        required
                >
            </div>

            <div class="form-group">
                <label for="registerUsername">用户名</label>

                <input
                        id="registerUsername"
                        type="text"
                        required
                >
            </div>

            <div class="form-group">
                <label for="registerPassword">密码</label>

                <input
                        id="registerPassword"
                        type="password"
                        required
                >
            </div>

            <button type="submit">
                注册
            </button>

        </form>

        <button
                id="backToLoginButton"
                class="switch-button"
                type="button"
        >
            已有账号？返回登录
        </button>

    </div>

    <p id="message"></p>

</div>

<script src="/index.js"></script>

</body>
</html>
